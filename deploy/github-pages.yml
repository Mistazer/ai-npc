name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de déclencher le déploiement à la main depuis l'onglet Actions,
  # utile pour publier depuis une branche de travail.
  workflow_dispatch:

# Autorisations requises par l'action de déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Active Pages automatiquement si ce n'est pas déjà fait, au lieu
          # d'échouer avec « Get Pages site failed / Not Found ».
          enablement: true

      - run: npm ci

      - name: Build statique
        # base_path vaut « /<nom-du-depot> » pour une Project Page, et une
        # chaîne vide pour une User Page ou un domaine personnalisé.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
